[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.black]
target-version = ["py312"]

[project]
name = "pdfwtf"
version = "0.2.0"
description = "Smart PDF parsing pipeline: remove pages, OCR scanned PDFs, export images, text, html ..."
authors = [
    { name = "Filip Kriz", email = "1353748+filak@users.noreply.github.com" }
]
license = { text = "AGPL-3.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=2.0",
    "ocrmypdf>=17.13.0",
    "pikepdf>=10.17.0",
    "pytesseract>=0.3.13",
    "click>=8.5.0",
    "selenium>=4.51.0",
    "webdriver-manager>=4.1.2",
    "cv3>=1.3.2",
    "pydantic==2.14.1",
    "pillow==13.0.0",
    "img2pdf==0.6.3",
    "python-dotenv==1.2.4",
    "llm-call==0.8.0",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
pdfwtf = "pdfwtf.cli:main"
pdfwtf-gui = "pdfwtf.gui.app:main"

[project.optional-dependencies]
gui = [
    "Flask>=3.1.3,<4.0.0",
    "Flask-Babel>=4.0.0,<5.0.0",
    "Flask-WTF>=1.3.0,<2.0.0",
]

[tool.uv-build]
include = ["src/pdfwtf/**"]

[tool.uv.sources]
llm-call = { git = "https://github.com/filak/llm-call.git" }

[dependency-groups]
dev = [
    "black>=26.10.1",
    "djlint>=1.47.1",
    "flake8>=7.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]
