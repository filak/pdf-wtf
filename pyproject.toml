[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[project]
name = "pdfwtf"
version = "0.1.1"
description = "Smart PDF parsing pipeline: remove pages, OCR scanned PDFs, export images & text"
authors = [
    { name = "Filip Kriz", email = "1353748+filak@users.noreply.github.com" }
]
license = { text = "AGPL-3.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.28.0",
    "ocrmypdf>=17.12.0",
    "pikepdf>=10.13.0",
    "pytesseract>=0.3.0",
    "click>=8.5.0",
    "selenium>=4.38.0",
    "webdriver-manager>=4.1.0",
    "cv3>=1.3.0",
    "pydantic==2.13.0",
]

[project.scripts]
pdfwtf = "pdfwtf.cli:main"

[tool.uv-build]
include = ["src/pdfwtf/**"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "pip-audit>=2.9.0",
    "pytest>=9.0.0",
]
