<span id="partition-actions-{{ job_id }}" class="d-inline-flex gap-1"{% if update_actions %} hx-swap-oob="outerHTML"{% endif %}>
  {% if has_partition %}
  <a class="btn btn-sm btn-secondary shadow-sm" href="{{ url_for('pdfwtf_gui.review', job_id=job_id) }}">{{ _('Review') }}</a>
  {% endif %}
  {# Export is available without partitioning. Without a plan, the whole PDF is one unit. #}
  <button type="button" class="btn btn-sm btn-success shadow-sm"
          data-bs-toggle="modal" data-bs-target="#export-options"
          data-export-url="{{ url_for('pdfwtf_gui.start_export', job_id=job_id) }}"
          data-export-status-url="{{ url_for('pdfwtf_gui.export_status', job_id=job_id) }}"
          title="{% if has_plan %}{{ _('Export the units of the saved plan.') }}{% else %}{{ _('Export the whole PDF as one unit.') }}{% endif %}">{{ _('Export') }}</button>
</span>
