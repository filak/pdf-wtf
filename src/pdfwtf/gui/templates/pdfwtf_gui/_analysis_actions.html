<span id="analysis-actions-{{ job_id }}" class="d-inline-flex gap-1"{% if update_actions %} hx-swap-oob="outerHTML"{% endif %}>
  {% if has_analysis %}
  <a class="btn btn-sm btn-secondary shadow-sm" href="{{ url_for('pdfwtf_gui.review', job_id=job_id) }}">{{ _('Review') }}</a>
  {% endif %}
  {% if has_plan %}
  <button type="button" class="btn btn-sm btn-success shadow-sm"
          data-bs-toggle="modal" data-bs-target="#export-options"
          data-export-url="{{ url_for('pdfwtf_gui.start_export', job_id=job_id) }}"
          data-export-status-url="{{ url_for('pdfwtf_gui.export_status', job_id=job_id) }}">{{ _('Export') }}</button>
  {% endif %}
</span>
