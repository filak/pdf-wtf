# Use UTF-8. Restart the process after changes.
# Paths resolve from PDFWTF_HOME. Do not store secrets here.

[pdf-wtf]
INPUT_DIR = "instance/_data/in"
OUTPUT_DIR = "instance/_data/out"
TEMP_DIR = "instance/temp"
LOGS_DIR = "instance/logs"


# task: context (pdfwtf command)
# - description{cs|en}, document_types[], pipeline,
# - template (src/pdfwtf/templates/llm/*.py - must contain: prompt, system)
LLM_TASKS = {
                "clean_html": {
                    "context": "export",
                    "description": {"en": "Clean HTML output", "cs": "Vyčistit HTML výstup"},
                    "document_types": ["unit"],
                    "pipeline": "export_html_flag",
                    "template": "wp_html"
                }
            }
