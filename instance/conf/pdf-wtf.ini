# Use UTF-8. Restart the process after changes.
# Paths resolve from PDFWTF_HOME. Do not store secrets here.

[pdf-wtf]
INPUT_DIR = "instance/_data/in"
OUTPUT_DIR = "instance/_data/out"
TEMP_DIR = "instance/temp"
LOGS_DIR = "instance/logs"


# LLM tasks run only when selected with --llm-task.
# - description: {"en": ..., "cs": ...}; "en" is required.
# - commands: pdfwtf commands that accept the task. The stage limits them.
# - stage: after_unit_html (supports export only; requires --get-html).
#   Export is the only implemented LLM stage. enhance and partition accept
#   --llm-task, but no task can run for them yet.
# - provider: llm-call provider name. The only provider is "gemini".
# - template: module in src/pdfwtf/templates/llm/ with "prompt" and "system".
# - output.suffix: result file suffix, for example <unit-id>.clean.html.
# Set GEMINI_API_KEY in the operating-system environment, not here.
LLM_TASKS = {
                "clean_html": {
                    "description": {"en": "Clean HTML output", "cs": "Vyčistit HTML výstup"},
                    "commands": ["export"],
                    "stage": "after_unit_html",
                    "provider": "gemini",
                    "template": "wp_html",
                    "output": {"suffix": ".clean.html"}
                }
            }
